name: Global position public discovery
on:
  schedule:
    - cron: '5 23 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/*global_position*'
      - '.github/workflows/global-position-discovery.yml'
permissions:
  contents: write
concurrency:
  group: global-position-discovery
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Collect public RSS candidates
        run: python3 scripts/collect_global_position.py
      - name: Validate discovery report
        run: python3 scripts/validate_global_position.py global-position/discovery/latest.json
      - name: Publish only discovery paths
        run: |
          git config user.name 'radar-position-bot'
          git config user.email 'radar-position-bot@users.noreply.github.com'
          git add global-position/discovery
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh public global-position discovery'
          git pull --rebase origin main
          git push origin HEAD:main
